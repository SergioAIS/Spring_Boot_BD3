spring.application.name=uvbd3_backe

server.port=9090

# Configurar para acceder a la base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/bd3_ga
spring.datasource.username=root
spring.datasource.password=1234

#Configurar para mapear una clase a una tabla en la Base de datos MySQL
spring.jpa.hibernate.ddl-auto=update

#Configurar para ver por consola el mappeo de una clase a una tabla (Opcional)
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
